return '<div class=card><h2>Indian medicine directory</h2><p>Five product examples per class where substantiated, including fixed-dose combinations. Brand listings are examples, not a sales ranking or prescribing recommendation.</p><p class=sm>Sources checked '+MEDICINE_REVIEW_DATE+'. Prices are static reference prices in INR, not live quotes. MRP, selling price and unit price are labelled separately; verify the current pack. Listing does not confirm local stock. Company details identify manufacturer or marketer as reported; batch manufacturer may differ.</p><label for=q>Search medicines</label><input type=search id=q placeholder="Drug, brand, manufacturer, condition or class…" oninput="mf()"><label for=mc>Drug class</label><select id=mc onchange="mf()"><option value="">All classes</option>'+MEDICINE_GROUPS.map(function(g,i){return '<option value="'+i+'">'+esc(g.name)+'</option>'}).join('')+'</select><label for=mt>Formulation</label><select id=mt onchange="mf()"><option value="">All formulations</option><option value="combo">Combinations only</option><option value="single">Single-ingredient products</option></select><button class="btn s" onclick="resetMedicines()">Clear filters</button><p id=medcount class=sm role=status aria-live=polite></p></div><div id=tb></div><div class=card><h2>Clinical context and source limits</h2><p>Abscess drainage is the main treatment. Antibiotics are selective for cellulitis, systemic infection or immunosuppression; they do not replace drainage. Ciprofloxacin plus metronidazole refers to separately selected medicines, not an instruction to use an arbitrary fixed combination.</p><p><a href="https://www.ascrsu.com/ascrs/view/ASCRS-Evidence-Based-Guidelines-and-Expert-Consensus/3982014/0/Management_of_Anorectal_Abscess__Fistula_in_Ano__and_Rectovaginal_Fistula__2022_" target=_blank rel="noopener noreferrer">ASCRS abscess guidance</a></p><p class=sm>Where a product source only identifies the marketer, the manufacturing site is not inferred. Unverified pack sizes are explicitly marked. Ayurvedic formulations are distinct products with limited comparative evidence; the formulation filter does not classify their full ingredient lists. Specialist botulinum-toxin products have non-interchangeable units; prices exclude administration.</p></div>'}
function resetMedicines(){document.getElementById("q").value="";document.getElementById("mc").value="";document.getElementById("mt").value="";mf()}
function mf(){
var v=document.getElementById("q").value.trim().toLowerCase(),c=document.getElementById("mc").value,t=document.getElementById("mt").value,n=0;
var cards=MEDICINE_GROUPS.map(function(g,i){
if(c!==""&&String(i)!==c)return "";
var rows=g.rows.filter(function(r){var herbal=g.name.indexOf("Ayurvedic")===0;return (!t||(t==="combo"?r.combination:!r.combination&&!herbal))&&[g.name,g.condition,r.brand,r.composition,r.company,r.pack].join(" ").toLowerCase().includes(v)});
if(!rows.length)return "";
n+=rows.length;
return '<section class=card><h2>'+esc(g.name)+'</h2><p class=sm>'+esc(g.condition)+' · '+rows.length+' of '+g.rows.length+' entries</p><p>'+esc(g.note)+'</p><div class=tw tabindex=0 role=region aria-label="'+esc(g.name)+' medicine table"><table><thead><tr><th scope=col>Brand / formulation</th><th scope=col>Composition / strength</th><th scope=col>Manufacturer / marketer</th><th scope=col>Pack / price unit</th><th scope=col>Reference cost (₹)</th><th scope=col>Source</th></tr></thead><tbody>'+rows.map(function(r){return '<tr><td><b>'+esc(r.brand)+'</b>'+(r.combination?'<br><span class=sm>Combination</span>':'')+'</td><td>'+esc(r.composition)+'</td><td>'+esc(r.company)+'</td><td>'+esc(r.pack)+'</td><td>₹'+Number(r.price).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})+'<br><span class=sm>'+esc(r.priceType)+'</span></td><td><a href="'+esc(r.source)+'" target=_blank rel="noopener noreferrer">View listing</a></td></tr>'}).join('')+'</tbody></table></div></section>'
}).join("");
document.getElementById("medcount").textContent=n+" product entries shown • checked "+MEDICINE_REVIEW_DATE;
document.getElementById("tb").innerHTML=cards||'<div class=card><p>No medicines match these filters.</p></div>';
}
function learn(){
function c(t,b){return '<div class=card><h2>'+t+'</h2>'+b+'</div>'}
return c("Hemorrhoids",'<ul><li>Present with bleeding and protrusion; pain is less common than with fissure. Severe pain suggests thrombosis.</li><li>Bleeding: painless bright red blood in the toilet or on wiping.</li><li>Diagnosis is by physical examination, digital examination and anoscopy.</li></ul>')+
c("Anorectal abscess",'<ul><li>Men:women 3:1; peak in third to fifth decades. More common with diabetes, hematologic disorders, IBD, HIV.</li><li>Cryptoglandular infection: perianal 40–50%, ischiorectal 20–25%, intersphincteric 2–5%, supralevator 2.5%.</li><li>Perianal pain and fever are hallmarks. Treatment: drainage (Mallekot drain for larger cavities); OR drainage for complicated or high-risk patients.</li></ul>')+
c("Fistula in ano",'<ul><li>Communication between an abscess cavity and an internal opening, usually at the dentate line. 30–40% of abscesses lead to fistula.</li><li>Types: intersphincteric 70%, transsphincteric 23%, suprasphincteric 5%, extrasphincteric 2%.</li><li>Treatment: seton placement; fistulotomy for intersphincteric and low transsphincteric (less than one-third of muscle); advancement flap, fibrin glue, LIFT for higher tracts. Recurrence 0–18% after fistulotomy; incontinence rare (&lt;10%).</li><li>Crohn’s fistulas: mesenchymal stem cell therapy (ADMIRE) improved remission at 52 weeks (59% vs 42%).</li></ul>')+
c("Anal fissure",'<ul><li>Most common cause of rectal bleeding in infancy. Mostly posterior (or anterior) midline; related to constipation, diarrhea, trauma, Crohn’s.</li><li>Raised internal sphincter pressure causes relative ischemia and poor healing.</li><li>Chronic: present over 6 weeks; sentinel pile, hypertrophied papilla, visible sphincter fibers.</li><li>Conservative care heals 60–90%: fiber, softeners, topical anesthetics, sitz baths. Nifedipine ointment TDS or botulinum toxin heals over 80%. Surgery: lateral internal sphincterotomy (incontinence risk, more in women).</li></ul>')}
function show(){
var h=document.getElementById("nav");h.innerHTML=tabs.map(function(t,i){return '<button class="'+(i==cur?'on':'')+'" onclick="cur='+i+';show()">'+t+'</button>'}).join('');
document.getElementById("m").innerHTML=[assess,hx,med,learn][cur]();if(cur==2)mf();window.scrollTo(0,0)}
show();
</script></body></html>
